[package]
name = "posara-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["knh190"]
description = "no_std posara runtime core: plugins and driver traits shared by every platform."

[features]
diag = ["sfx"]
default = []
std = []
gfx = ["dep:libm"]
sfx = ["dep:libm"]
synth = ["sfx"]
audio-profile = ["sfx"]
rp32 = ["sfx"]
fs = []
imu = []
midi = []
net = []

[dependencies]
libm = { version = "0.2", optional = true }
myriad-rs = { git = "https://github.com/KHN190/Abrase", branch = "dev" }
polka-rs = { git = "https://github.com/KHN190/Abrase", branch = "dev" }

[lib]
doctest = false

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

# Tests and generators that only make sense with a capability enabled.
[[example]]
name = "generate_note_frequencies"
required-features = ["rp32"]

[[test]]
name = "trace"
required-features = ["sfx"]

[[test]]
name = "phase_lookup_test"
required-features = ["sfx"]

