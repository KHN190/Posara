[package]
name = "posara"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["knh190"]
description = "General platform Myriad runtime visual-audio engine."

# desktop = minifb/cpal Device impls; web = headless fb + pull-mixer (same ports).
[features]
default = ["desktop", "test"]
desktop = ["gfx-desktop", "sfx-desktop", "storage-disk", "synth", "midi", "imu", "compiler", "fs", "net"]
web = ["gfx-web", "sfx-web", "synth", "imu", "compiler", "fs", "net"]

gfx = ["posara-core/gfx"]
gfx-desktop = ["gfx", "dep:minifb", "dep:image"]
gfx-web = ["gfx"]
sfx = ["posara-core/sfx"]
sfx-desktop = ["sfx", "dep:cpal"]
sfx-web = ["sfx"]

compiler = ["dep:abrase", "dep:polka-rustc"]
fs = []
# UDP/OSC. desktop = real UdpSocket, web = stub (see designs/net.md).
net = ["posara-core/net"]
# storage backend: real disk (desktop) vs in-memory upload sandbox (web default).
storage-disk = []
synth = ["sfx", "posara-core/synth"]
midi = ["dep:midir", "dep:toml", "posara-core/midi"]
imu = ["posara-core/imu"]
test = []

[[bin]]
name = "posara"
required-features = ["gfx-desktop", "sfx-desktop"]

[lib]
doctest = false

[dependencies]
minifb = { version = "0.27", optional = true }
cpal = { version = "0.15", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
midir = { version = "0.10", optional = true }
toml  = { version = "0.8", optional = true, default-features = false, features = ["parse"] }
web-time = "1"
posara-core = { path = "../posara-core", features = ["std", "fs"] }
myriad-rs = { git = "https://github.com/KHN190/Abrase", branch = "dev" }
polka-rs  = { git = "https://github.com/KHN190/Abrase", branch = "dev" }
abrase    = { git = "https://github.com/KHN190/Abrase", optional = true, branch = "dev" }
polka-rustc = { git = "https://github.com/KHN190/Abrase", optional = true, branch = "dev" }
