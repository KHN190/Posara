name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # minifb (window) + cpal (audio) need X11/Wayland + ALSA dev libs on Linux.
      - name: Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test -p posara

      - name: Build posara (desktop)
        run: cargo build --release -p posara

      - name: Package
        run: |
          cd target/release
          tar czf posara-${{ matrix.name }}.tar.gz posara

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/release/posara-${{ matrix.name }}.tar.gz
