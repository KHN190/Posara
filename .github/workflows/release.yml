name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # minifb (window) + cpal (audio) need X11/Wayland + ALSA dev libs on Linux.
      - name: Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: |
          python3 scripts/check-contract.py
          cargo test -p posara
          cargo test -p posara --no-default-features --features web,test

      - name: Build posara (desktop)
        run: cargo build --release -p posara

      - name: Package
        run: |
          cd target/release
          tar czf posara-${{ matrix.name }}.tar.gz posara

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/release/posara-${{ matrix.name }}.tar.gz

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: bash scripts/install-wasm-pack.sh
      - name: Web execution contracts
        run: bash scripts/check-wasm.sh
      - name: Build web bundle
        run: |
          wasm-pack build crates/posara-web --release --no-opt --target web --out-dir pkg
          mkdir -p target/web
          cp -R crates/posara-web/www/. target/web/
          cp -R crates/posara-web/pkg target/web/pkg
          tar -czf target/posara-web.tar.gz -C target/web .
      - uses: actions/upload-artifact@v4
        with:
          name: posara-web
          path: target/posara-web.tar.gz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/posara-web.tar.gz
