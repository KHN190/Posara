# Virtual workspace. crates/ = publishable runtime members; tools/ = dev-only
# asset converters (opt-in via -p). The main crate lives in crates/posara.
[workspace]
resolver = "2"
members = ["crates/posara", "crates/posara-web", "tools/gfx", "tools/sfx"]
default-members = ["crates/posara"]

[profile.dev]
opt-level = 2

# optimized + symbolized: clean flamegraphs via `samply record target/release/posara bench cart`
[profile.release]
debug = true
